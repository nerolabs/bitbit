name: CI

# Gates every push and pull request: the Go suite (with a coverage
# floor), formatting, a race-detector build, a link-check plus
# changelog/roadmap freshness for the website, and a docs-ship-with-code
# check that a code change also touches the changelog. Branch protection
# should require these before merging to main or staging.
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  go:
    name: Go — vet, fmt, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^dist/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test + coverage floor
        run: |
          # -coverpkg=./... credits cross-package coverage, so the pure
          # core packages (exercised by the sim, which has no unit tests of
          # its own) count toward the total instead of showing as 0%.
          # -short skips the process-spawning e2e suite (its own job below);
          # e2e drives the built binary and adds no in-process coverage.
          go test -short -coverpkg=./... -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          floor=60.0
          echo "total coverage: ${total}% (floor ${floor}%)"
          if awk "BEGIN {exit !($total < $floor)}"; then
            echo "::error::coverage ${total}% is below the ${floor}% floor"; exit 1
          fi

  race:
    name: Go — race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test -race
        # -short skips e2e: its subprocesses aren't race-instrumented, so
        # the coverage isn't worth the minutes; the dedicated e2e job runs
        # the full form.
        run: go test -race -short ./...

  e2e:
    name: Go — multi-process e2e (real TCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test ./e2e
        # Builds the silt binary and drives real daemons over TCP:
        # publish → chain-commit → fetch, bit-perfect. This is the layer
        # the in-process sim skips — the class of bug #36 was.
        run: go test ./e2e/ -count=1 -v

  nat-integration:
    name: Integration — cross-NAT over a real relay (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Cross-NAT publish → fetch through the relay (+ restart survival)
        # Stands up two NATed daemons + a public relay in real container
        # networks (real kernel NAT via iptables MASQUERADE), publishes from
        # behind NAT A and fetches from behind NAT B, asserting bit-perfect
        # across the relay. This is the automatable replacement for the
        # manual two-machine (Mac A ↔ Mac B) rig — the layer that proves the
        # relay/NAT path, which flat-localhost e2e can't. Docker + compose
        # are preinstalled on ubuntu-latest. RESTART=1 also restarts the whole
        # swarm and re-fetches, gating the #69 reprovide-on-restart fix.
        run: RESTART=1 ./integration/nat/run.sh

  nat-holepunch:
    name: Integration — NAT hole-punch (cone punches, symmetric falls back)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Cone NAT is punchable — raw primitive (direct connection through both NATs)
        run: ./integration/nat/probe.sh
      - name: Symmetric NAT defeats the punch — raw primitive (relay fallback is genuinely needed)
        run: NAT_MODE=symmetric ./integration/nat/probe.sh
      - name: Two NATed DAEMONS upgrade the relay path to direct (integrated, #27/#111)
        # The integrated path — caretaker traffic triggers the relay-coordinated
        # punch and both daemons go direct — not just the standalone probe. This
        # is the regression gate for #111 (the punch was never firing, then never
        # binding): a re-break fails here, locally and in CI (build-immutable V5).
        run: ./integration/nat/holepunch.sh
      - name: Symmetric NAT — integrated daemons correctly stay on the relay
        run: NAT_MODE=symmetric ./integration/nat/holepunch.sh

  website:
    name: Website — changelog + links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate changelog page
        run: python3 scripts/gen_changelog.py
      - name: Fail if changelog page is stale
        run: |
          if ! git diff --quiet -- website/changelog.html; then
            echo "website/changelog.html is out of date; run scripts/gen_changelog.py and commit."
            git --no-pager diff -- website/changelog.html
            exit 1
          fi
      - name: Generate roadmap page
        run: python3 scripts/gen_roadmap.py
      - name: Fail if roadmap page is stale
        run: |
          if ! git diff --quiet -- website/roadmap.html; then
            echo "website/roadmap.html is out of date; run scripts/gen_roadmap.py and commit."
            git --no-pager diff -- website/roadmap.html
            exit 1
          fi
      - name: Generate build-log page
        run: python3 scripts/gen_buildlog.py
      - name: Fail if build-log page is stale
        run: |
          if ! git diff --quiet -- website/buildlog.html; then
            echo "website/buildlog.html is out of date; run scripts/gen_buildlog.py and commit."
            git --no-pager diff -- website/buildlog.html
            exit 1
          fi
      - name: Check internal links resolve
        run: python3 scripts/check_links.py
      - name: Truth-in-labelling — every ledgered claim has a backing test
        run: python3 scripts/check_claims.py

  docs-shipped:
    name: Docs ship with code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG entry when code changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request — nothing to enforce"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "changed files:"; echo "$files"
          code=$(echo "$files" | grep -E '^(cmd|core|adapters)/' || true)
          if [ -n "$code" ] && ! echo "$files" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Code under cmd/, core/, or adapters/ changed but CHANGELOG.md was not updated. Add a line to the '## [Unreleased]' section (and re-run scripts/gen_changelog.py)."
            echo "code files that triggered this:"; echo "$code"
            exit 1
          fi
          echo "OK — docs ship with code"
