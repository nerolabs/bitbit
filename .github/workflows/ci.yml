name: CI

# Gates every push and pull request: the Go suite (with a coverage
# floor), formatting, a race-detector build, and a link-check of the
# website. Branch protection should require these before merging to main
# or staging.
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  go:
    name: Go — vet, fmt, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^dist/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test + coverage floor
        run: |
          go test -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          floor=45.0
          echo "total coverage: ${total}% (floor ${floor}%)"
          if awk "BEGIN {exit !($total < $floor)}"; then
            echo "::error::coverage ${total}% is below the ${floor}% floor"; exit 1
          fi

  race:
    name: Go — race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test -race
        run: go test -race ./...

  website:
    name: Website — changelog + links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate changelog page
        run: python3 scripts/gen_changelog.py
      - name: Fail if changelog page is stale
        run: |
          if ! git diff --quiet -- website/changelog.html; then
            echo "website/changelog.html is out of date; run scripts/gen_changelog.py and commit."
            git --no-pager diff -- website/changelog.html
            exit 1
          fi
      - name: Check internal links resolve
        run: python3 scripts/check_links.py
